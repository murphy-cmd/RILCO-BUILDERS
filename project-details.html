<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Project Details</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f5f5;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.container img{
width:100%;
height:500px;
object-fit:cover;
}

.content{
padding:30px;
}

.content h1{
margin-bottom:20px;
}

.info{
margin:15px 0;
font-size:18px;
}

.progress-bar{
width:100%;
height:15px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.progress{
height:100%;
background:#0A4DA2;
}

.back-btn{
display:inline-block;
margin-bottom:20px;
padding:10px 20px;
background:#0A4DA2;
color:white;
text-decoration:none;
border-radius:8px;
}

</style>

</head>

<body>

<a href="projects.html" class="back-btn">
← Back to Projects
</a>

<div class="container">

<img id="projectImage">

<div class="content">

<h1 id="projectTitle"></h1>

<div class="info">
<strong>Client:</strong>
<span id="projectClient"></span>
</div>

<div class="info">
<strong>Location:</strong>
<span id="projectLocation"></span>
</div>

<div class="info">
<strong>Budget:</strong>
₱<span id="projectBudget"></span>
</div>

<div class="info">
<strong>Status:</strong>
<span id="projectStatus"></span>
</div>

<div class="info">
<strong>Description:</strong>
<p id="projectDescription"></p>
</div>

<div class="progress-bar">
<div id="progressBar" class="progress"></div>
</div>

<p id="progressText"></p>

</div>

</div>

<script type="module" src="js/project-details.js"></script>

</body>
</html>
