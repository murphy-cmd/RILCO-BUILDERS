<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RILCO BUILDERS Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6f9;
display:flex;
}

/* SIDEBAR */

.sidebar{
width:260px;
height:100vh;
background:#0A4DA2;
color:white;
position:fixed;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
margin:15px 0;
}

.sidebar ul li a{
color:white;
text-decoration:none;
display:block;
padding:12px;
border-radius:8px;
transition:.3s;
}

.sidebar ul li a:hover{
background:rgba(255,255,255,.2);
}

/* MAIN */

.main{
margin-left:260px;
width:100%;
padding:30px;
}

.header{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h3{
color:#555;
}

.card h1{
color:#0A4DA2;
margin-top:10px;
}

.section{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:25px;
}

.section h2{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
}

button{
padding:12px 20px;
background:#0A4DA2;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

table th{
background:#0A4DA2;
color:white;
padding:12px;
}

table td{
padding:12px;
border:1px solid #ddd;
}

.delete-btn{
background:red;
}

@media(max-width:768px){

.sidebar{
width:100%;
height:auto;
position:relative;
}

.main{
margin-left:0;
}

}
</style>

</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h2>RILCO BUILDERS</h2>

<ul>
<li><a href="#">Dashboard</a></li>
<li><a href="#">Users</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">Reports</a></li>
<li><a href="#">Settings</a></li>
<li><a href="login.html">Logout</a></li>
</ul>

</div>

<!-- MAIN -->

<div class="main">

<div class="header">
<h1>Admin Dashboard</h1>
<p>Welcome Administrator</p>
</div>

<!-- STATS -->

<div class="cards">

<div class="card">
<h3>Total Users</h3>
<h1 id="userCount">0</h1>
</div>

<div class="card">
<h3>Total Projects</h3>
<h1 id="projectCount">0</h1>
</div>

<div class="card">
<h3>Messages</h3>
<h1>0</h1>
</div>

<div class="card">
<h3>Reports</h3>
<h1>0</h1>
</div>

</div>

<!-- USER MANAGEMENT -->

<div class="section">

<h2>User Management</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
</tr>
</thead>

<tbody id="userTable">
</tbody>

</table>

</div>

<!-- PROJECT MANAGEMENT -->

<div class="section">

<h2>Project Management</h2>

<input
type="text"
id="projectName"
placeholder="Project Name">

<input
type="text"
id="projectDescription"
placeholder="Project Description">

<button onclick="addProject()">
Add Project
</button>

<table>

<thead>
<tr>
<th>Project Name</th>
<th>Description</th>
<th>Action</th>
</tr>
</thead>

<tbody id="projectTable">

</tbody>

</table>

</div>

</div>

<script type="module" src="js/admin.js"></script>
<script type="module" src="js/project.js"></script>

</body>
</html>
