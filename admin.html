<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RILCO Admin Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f4f7fc;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100%;
background:#0A4DA2;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
padding:15px;
cursor:pointer;
border-radius:8px;
margin-bottom:10px;
}

.sidebar ul li:hover{
background:rgba(255,255,255,.2);
}

.main{
margin-left:250px;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h3{
color:#555;
}

.card p{
font-size:30px;
font-weight:bold;
color:#0A4DA2;
}

.table-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

button{
background:#0A4DA2;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#083c80;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>RILCO ADMIN</h2>

<ul>
<li onclick="showSection('dashboard')">Dashboard</li>
<li onclick="showSection('projects')">Projects</li>
<li onclick="showSection('services')">Services</li>
<li onclick="showSection('users')">Users</li>
<li onclick="showSection('messages')">Messages</li>
<li onclick="logout()">Logout</li>
</ul>

</div>

<div class="main">

<div id="dashboard">

<div class="cards">

<div class="card">
<h3>Users</h3>
<p id="userCount">0</p>
</div>

<div class="card">
<h3>Projects</h3>
<p id="projectCount">0</p>
</div>

<div class="card">
<h3>Services</h3>
<p id="serviceCount">0</p>
</div>

<div class="card">
<h3>Messages</h3>
<p id="messageCount">0</p>
</div>

</div>

</div>

<div id="users" style="display:none">

<div class="table-box">

<h2>Registered Users</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

</div>

</div>

</div>

<script type="module" src="js/admin.js"></script>

</body>
</html>
