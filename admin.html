<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>

.admin{
padding:30px;
}

.admin-header{
background:#0A4DA2;
color:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.stat-box{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th,
table td{
border:1px solid #ddd;
padding:12px;
}

</style>

</head>

<body>

<div class="admin">

<div class="admin-header">
<h2>RILCO BUILDERS ADMIN PANEL</h2>
</div>

<div class="stats">

<div class="stat-box">
<h3>Total Users</h3>
<h1 id="userCount">0</h1>
</div>

<div class="stat-box">
<h3>Total Projects</h3>
<h1 id="projectCount">0</h1>
</div>

</div>

<br>

<h3>Users</h3>

<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</div>

<script type="module" src="js/admin.js"></script>

</body>
</html>
