<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link rel="stylesheet" href="css/style.css">

<style>
.register-container{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f5f7fa;
padding:20px;
}

.register-card{
background:white;
padding:40px;
width:min(450px,100%);
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.register-card h2{
text-align:center;
margin-bottom:20px;
color:#0A4DA2;
}

.register-card input{
width:100%;
margin-bottom:15px;
}

.register-card button{
width:100%;
}

.register-card p{
margin-top:15px;
text-align:center;
}

.register-card a{
color:#0A4DA2;
text-decoration:none;
font-weight:600;
}
</style>

</head>
<body>

<div class="register-container">

<form class="register-card" onsubmit="event.preventDefault(); register();">

<h2>Create Account</h2>

<input
type="text"
id="fullname"
placeholder="Full Name"
required
>

<input
type="email"
id="email"
placeholder="Email"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit">
Register
</button>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
