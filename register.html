<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link rel="stylesheet" href="css/style.css">

<style>
.register-container{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f5f7fa;
}

.register-card{
background:white;
padding:40px;
width:450px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.register-card h2{
text-align:center;
margin-bottom:20px;
color:#0A4DA2;
}

.register-card input{
width:100%;
margin-bottom:15px;
}

.register-card button{
width:100%;
}
</style>

</head>
<body>

<div class="register-container">

<div class="register-card">

<h2>Create Account</h2>

<input
type="text"
id="fullname"
placeholder="Full Name"
>

<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="register()">
Register
</button>

</div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
