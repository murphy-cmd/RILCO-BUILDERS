<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Projects</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f5f5;
padding:40px;
}

h1{
margin-bottom:30px;
}

.project-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:25px;
}

.project-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.project-card img{
width:100%;
height:250px;
object-fit:cover;
}

.content{
padding:20px;
}

.progress-bar{
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}

.progress{
height:100%;
background:#0A4DA2;
}

.status{
margin-top:10px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>Company Projects</h1>

<div id="projectGrid" class="project-grid"></div>

<script type="module" src="js/project.js"></script>

</body>
</html>
