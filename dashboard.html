<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RILCO BUILDERS Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#0A4DA2;
color:white;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
font-size:28px;
}

.logout-btn{
background:red;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

.logout-btn:hover{
background:darkred;
}

.welcome{
padding:20px 40px;
font-size:22px;
font-weight:bold;
color:#333;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px 40px;
}

.stat-card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
text-align:center;
}

.stat-card h2{
color:#0A4DA2;
font-size:30px;
margin-bottom:10px;
}

.dashboard-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px 40px;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
cursor:pointer;
transition:.3s;
text-align:center;
}

.card:hover{
transform:translateY(-8px);
}

.card h2{
color:#0A4DA2;
margin-bottom:10px;
}

.card p{
color:#666;
}

</style>
</head>

<body>

<div class="header">
<h1>RILCO BUILDERS USER DASHBOARD</h1>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="welcome" id="welcome">
Loading...
</div>

<div class="stats">

<div class="stat-card">
<h2 id="projectCount">0</h2>
<p>Projects</p>
</div>

<div class="stat-card">
<h2 id="serviceCount">0</h2>
<p>Services</p>
</div>

<div class="stat-card">
<h2 id="messageCount">0</h2>
<p>Messages</p>
</div>

</div>

<div class="dashboard-grid">

<div class="card" onclick="location.href='projects.html'">
<h2>📁 Projects</h2>
<p>View company projects and progress.</p>
</div>

<div class="card" onclick="location.href='services.html'">
<h2>🏗 Services</h2>
<p>Browse available services.</p>
</div>

<div class="card" onclick="location.href='profile.html'">
<h2>👤 Profile</h2>
<p>Manage account settings.</p>
</div>

<div class="card" onclick="location.href='messages.html'">
<h2>💬 Messages</h2>
<p>Contact administration.</p>
</div>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
