<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RILCO BUILDERS Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>
.dashboard{
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#0A4DA2;
color:white;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.logout-btn{
background:red;
padding:10px 20px;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}
</style>

</head>
<body>

<div class="dashboard">

<div class="topbar">

<h2>RILCO BUILDERS USER DASHBOARD</h2>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<h3 id="welcome"></h3>

<br>

<div class="cards">

<div class="card">
<h3>Projects</h3>
<p>View company projects.</p>
</div>

<div class="card">
<h3>Services</h3>
<p>Browse available services.</p>
</div>

<div class="card">
<h3>Profile</h3>
<p>Manage account settings.</p>
</div>

<div class="card">
<h3>Messages</h3>
<p>Contact administration.</p>
</div>

</div>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
